name: Build Standalone Executables & Release Packages

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Compiler Pipeline (Compile.ps1)
        shell: powershell
        run: |
          .\Compile.ps1

      - name: Upload Compiled Executables & Portable Packages
        uses: actions/upload-artifact@v4
        with:
          name: WinBreathe-Release-Binaries
          path: |
            WinBreathe.exe
            releases/v1.1.0/*
            releases/v2.0.0/*
            releases/v2.1.0/*

      - name: Publish GitHub Release on Tag Push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            releases/${{ github.ref_name }}/*
