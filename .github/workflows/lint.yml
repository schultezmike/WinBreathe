name: PowerShell Syntax & Catalog Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Isolated compatibility regressions
        shell: powershell
        run: |
          .\tests\Compatibility.Tests.ps1
          .\tests\Report.Tests.ps1
          .\tests\SnapshotFile.Tests.ps1

      - name: Validate PowerShell syntax and encoding
        shell: powershell
        run: .\Compile.ps1 -VerifyOnly

      - name: Validate tweaks.json Schema & Dry-Run Preview
        shell: powershell
        run: |
          $catalog = Get-Content .\config\tweaks.json -Raw | ConvertFrom-Json
          if ($catalog.tweaks.Count -lt 20) {
              throw "Expected at least 20 tweaks in config/tweaks.json"
          }
          .\src\WinBreathe.ps1 -Status
          .\src\WinBreathe.ps1 -Profile Balanced -WhatIf
