name: PowerShell Syntax & Catalog Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate PowerShell AST Syntax & Pure ASCII Encoding
        shell: powershell
        run: |
          $scripts = Get-ChildItem -Path .\src -Include *.ps1, *.psm1 -Recurse
          foreach ($s in $scripts) {
              $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile($s.FullName, [ref]$null, [ref]$errors)
              if ($errors.Count -gt 0) {
                  throw "Syntax errors in $($s.Name): $($errors | Out-String)"
              }
              $bytes = [System.IO.File]::ReadAllBytes($s.FullName)
              $nonAscii = $bytes | Where-Object { $_ -gt 127 }
              if ($nonAscii) {
                  throw "Non-ASCII characters detected in $($s.Name). Keep scripts pure 7-bit ASCII."
              }
              Write-Host "[OK] $($s.Name): 0 syntax errors, pure ASCII verified." -ForegroundColor Green
          }

      - name: Validate tweaks.json Schema & Dry-Run Preview
        shell: powershell
        run: |
          $catalog = Get-Content .\config\tweaks.json -Raw | ConvertFrom-Json
          if ($catalog.tweaks.Count -lt 20) {
              throw "Expected at least 20 tweaks in config/tweaks.json"
          }
          .\src\WinBreathe.ps1 -Status
          .\src\WinBreathe.ps1 -Profile Balanced -WhatIf
